[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "GMAIL_USER,NEXTAUTH_URL,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_STREAM_PROXY_URL,BING_SITE_VERIFICATION,GOOGLE_SITE_VERIFICATION"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache"
